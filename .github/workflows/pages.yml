# GitHub Pages edition of OptionLens.
# Refreshes a yfinance market-data snapshot for the tickers in market-data-service/tickers.txt,
# builds the static site (all analysis runs in the visitor's browser) and deploys it.
# The snapshot is published with the site, never committed, so the repo doesn't grow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 30 min during US market hours (13:30–20:00 UTC ≈ 9:30–16:00 ET), Mon–Fri,
    # plus one run after the close. GitHub may delay scheduled runs at busy times.
    - cron: "*/30 13-20 * * 1-5"
    - cron: "30 21 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-data-service/requirements.txt

      - name: Build market-data snapshot (yfinance)
        working-directory: market-data-service
        run: |
          pip install -r requirements.txt
          python snapshot.py ../public/data tickers.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Engine tests (offline invariants)
        run: npm test

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
